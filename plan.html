<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastavni plan</title>
        
    <link rel="stylesheet" href="style\styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>
<body>
    <header>
        <nav class="navbar">
        <div id="auth-area"></div>

        <a href="index.html" class="link"><i class="fa-solid fa-home"></i>Početna</a>
        <a href="about.html" class="link"><i class="fa-solid fa-circle-info"></i>O nama</a>
        <a href="news.html" class="link"><i class="fa-solid fa-newspaper"></i>Novosti</a>

        <a id="nastavni-plan" class="link" href="plan.html" style="display:none;">
            Nastavni plan
        </a>

        <a href="#" class="link" id="openModal"><i class="fa-solid fa-envelope"></i>Kontakt</a>
        </nav>
    </header> 

    
    <main>

        <div class="main-header">
            Nastavni plan
        </div>
        <div class="plan-wrapper">
            <!-- lijevi dio -->
            <section class="plan-left">
                <label for="courseSearch">Naziv kolegija:</label>
    
                <div class="autocomplete">
                    <input id="courseSearch" type="text" placeholder="Upiši naziv..." autocomplete="off" />
                    <ul id="suggestions" class="suggestions"></ul>
                </div>
            </section>
    
            <!-- desni dio -->
            <section class="plan-right">
                <table class="plan-table">
                    <thead>
                        <tr>
                        <th>Kolegij</th>
                        <th>ECTS</th>
                        <th>Sati</th>
                        <th>Predavanja</th>
                        <th>Vježbe</th>
                        <th>Tip</th>
                        <th></th>
                        </tr>
                    </thead>
        
                    <tbody id="selectedBody"></tbody>
        
                    <tfoot>
                        <tr class="total-row">
                        <td>Ukupno</td>
                        <td id="totalEcts">0</td>
                        <td id="totalSati">0</td>
                        <td id="totalPredavanja">0</td>
                        <td id="totalVjezbe">0</td>
                        <td></td>
                        <td></td>
                        </tr>
                    </tfoot>
                </table>
    
                <p id="apiError" style="color:red; display:none; margin-top:12px;"></p>
            </section>
        </div>
    </main>

    <footer class="footer">
        <img src="img/zaiskri-bg.jpg" alt="Zaiskri background">

        <div class="footer-text">
            <p class="footer_slogan">BUDI IZVRSTAN U ONOM ŠTO VOLIŠ</p>
            <p class="footer_slogan footer_zaiskri">ZAISKRI</p>
        </div>
    </footer>

    <!-- MODAL ZA KONTAKT -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <span class="close-btn" id="closeModal">&times;</span>
                <h2>Kontakt obrazac</h2>

                <form action="https://www.fulek.com/mvc/supit/project-contact-form" method="get">

                <label for="fullName">Puno ime i prezime:</label>
                <input id="fullName" name="FullName" type="text" required>

                <label for="email">Email:</label>
                <input id="email" name="Email" type="email" required autocomplete="email">

                <label for="importance">Važnost poruke:</label>
                <select id="importance" name="Importance" required>
                    <option value="">-- Odaberite --</option>
                    <option value="low">Niska</option>
                    <option value="medium">Srednja</option>
                    <option value="high">Visoka</option>
                </select>

                <label class="checkbox">
                    <input type="checkbox" name="ReceiveNewsletter" value="true">
                    Želim primati newsletter
                </label>

                <label for="message">Poruka:</label>
                <textarea id="message" name="Message" rows="4" required></textarea>

                <div class="buttons">
                    <button type="submit">Pošalji</button>
                    <button type="reset">Poništi</button>
                </div>

                </form>
            </div>
        </div>
        <script>
            const openBtn = document.getElementById("openModal");
            const closeBtn = document.getElementById("closeModal");
            const overlay = document.getElementById("modalOverlay");

            openBtn.addEventListener("click", () => overlay.classList.add("active"));
            closeBtn.addEventListener("click", () => overlay.classList.remove("active"));
            overlay.addEventListener("click", e => {
                if (e.target === overlay) overlay.classList.remove("active");
            });
            
        </script>
    <script src="js\plan.js"></script>
    <script type="module" src="js\shared.js"></script>


</body>
</html>
